<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Pearl Hotel | Dashboard</title>
    <!-- Link CSS file -->
    <link rel="stylesheet" href="style.css">

</head>
<body>
<!-- Main dashboard container -->
<div class="dashboard-container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <!-- Logo -->
        <div class="logo">
            <h2> Blue pearl Hotel</h2>

        </div>
        <!-- navigation links -->
        <nav>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="rooms.html">Rooms</a></li>
                <li><a href="customers.html">Customers</a></li>
                <li><a href="bookings.html">Bookings</a></li>
                <li><a href="payments.html">Payments</a></li>
            </ul>
        </nav>

    </aside>
    <!-- Main content -->
    <main class="main-content">

        <!-- Header Section-->
        <section>
            <header class="header">
                <div>
                    <h1>Customers</h1>
                </div>
                <div class="admin-info">
                    <span>Administrator</span>
                </div>

            </header>
        </section>
        <!-- Customer Statistics -->
        <section class="Statistics">

            <div class="card">
                <h3>Total Customers</h3>
                <p id="totalCustomers">0</p>
            </div>

        </section>

        <!-- Customer Registration Form -->
         <div class="container-grid">
        <section class="customer-form">

            <h2 id="formTitle">Register Customer</h2>

            <form id="customerForm">

                <div class="form-group">
                    <label for="customerName">Full Name:</label>
                    <br>
                    <input type="text" id="customerName" placeholder="Enter full name" required>
                </div>
<br>
                <div class="form-group">
                    <label for="customerPhone">Phone Number:</label>
                    <br>
                    <input type="tel" id="customerPhone" placeholder="Enter phone number" required>
                </div>
<br>
                <div class="form-group">
                    <label for="customerEmail">Email Address:</label>
                    <br>
                    <input type="email" id="customerEmail" placeholder="Enter email address" required>
                </div>
<br>
                <button type="submit" class="save-btn" id="saveCustomerBtn">
                    Register Customer
                </button>

            </form>

        </section>
        <br>
        <!-- Customer Records -->
<section class="customer-table">

    <div class="section-header">
        <h2>All Customers</h2>

         <table border="1">

            <thead>
                <tr>
                    <th>Customer ID</th>
                    <th>Full Name</th>
                    <th>Phone Number</th>
                    <th>Email Address</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="customerList">
                <!-- JavaScript will display customer records here -->
            </tbody>

        </table>
    </div>
</section>
         </div>
    </main>
</div>
         <script src="customers.js"></script>
        </body>

</html>

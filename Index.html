<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Pearl Hotel | login</title>
    <!-- Link CSS file -->
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <!-- Main login container -->
    <div class="login-container">

        <!-- LEFT SECTION: Hotel image and information -->
        <div class="hotel-section">

            <!-- Hotel name -->
            <div class="hotel-name">
                <h1> Blue Pearl Hotel</h1>
            </div>

            <!-- Hotel background image -->
            <div class="hotel-image">

                <img src="images/hotel_view.jpg" alt="Blue Pearl Hotel Building">

            </div>

            <!-- Welcome message -->
            <div class="hotel-description">

                <p> Welcome to Blue Pearl Hotel Where Comfort Meets Excellence.</p>
            </div>

        </div>
 <!-- RIGHT SECTION: Login and registration -->
        <div class="form-section">

            <!-- admin portal label -->
            <div class="portal-label">
                <span>Admin Portal</span>
            </div>


            <!-- LOGIN FORM -->
            <div class="login-form">

                <h2>Welcome Back!</h2>

                <p>Sign in to continue to your dashboard.</p>

                <form id="loginForm">

                    <!-- Email -->
                    <div class="form-group">

                        <label for="loginEmail">Email Address</label>

                        <input type="email" id="loginEmail" placeholder="Enter your email address" required>
                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="loginPassword">Password</label>

                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    </div>

                    <!-- Remember me and forgot password -->
                    <div class="form-options">

                        <label>
                            <input type="checkbox" id="rememberMe">Remember me</label>

                        <a href="#">Forgot password?</a>

                    </div>

                    <!-- Login button -->
                    <button type="submit" class="login-btn">
                        Sign In
                    </button>

                </form>


       
    <script src="login.js"></script>
</body>

</html>

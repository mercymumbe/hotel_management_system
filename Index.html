<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Pearl Hotel | login</title>
    <!-- Link CSS file -->
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <!-- header section -->
    <header>
        <div class="heros-image">
            <img src="images/hotel_view.jpg" alt="Hotel_images">
        </div>
    </header>

    <!-- login form section -->
    <main>
        <div class="login-container">
            <h1>Blue Pearl Hotel</h1>
            <h2>welcome Back!</h2>
            <p>sign in to access hotel management system</p>

            <form id="loginForm">

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
<br>
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>

                <div class="login-options">

                    <label>
                        <input type="checkbox" id="rememberMe">Remember me</label>

                        <a href="#">Forgot Password?</a>

                </div>
<br>
                <button type="submit">Sign In</button>

                <p id="errorMessage"></p>

            </form>


        </div>
    </main>
<script src="login.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Pearl Hotel | login</title>
    <!-- Link CSS file -->
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <!-- Main login container -->
    <div class="login-container">

        <!-- LEFT SECTION: Hotel image and information -->
        <div class="hotel-section">

            <!-- Hotel name -->
            <div class="hotel-name">
                <h1> Blue Pearl Hotel</h1>
            </div>

            <!-- Hotel background image -->
            <div class="hotel-image">

                <img src="images/hotel_view.jpg" alt="Blue Pearl Hotel Building">

            </div>

            <!-- Welcome message -->
            <div class="hotel-description">

                <p> Welcome to Blue Pearl Hotel Where Comfort Meets Excellence.</p>
            </div>

        </div>


       
    <script src="login.js"></script>
</body>

</html>

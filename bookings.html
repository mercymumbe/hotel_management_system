<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Pearl Hotel | Dashboard</title>
    <!-- Link CSS file -->
    <link rel="stylesheet" href="style.css">

</head>
<!-- Main dashboard container -->
<div class="dashboard-container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <!-- Logo -->
        <div class="logo">
            <h2> Blue pearl Hotel</h2>

        </div>
        <!-- navigation links -->
        <nav>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="rooms.html">Rooms</a></li>
                <li><a href="customers.html">Customers</a></li>
                <li><a href="bookings.html">Bookings</a></li>
                <li><a href="payments.html">Payments</a></li>
            </ul>
        </nav>

    </aside>
    <!-- Main content -->
    <main class="main-content">

        <!-- Header Section-->
        <section>
            <header class="header">
                <div>
                    <h1>Bookings</h1>
                </div>
                <div class="admin-info">
                    <span>Administrator</span>
                </div>

            </header>
        </section>

        <!-- Booking Statistics -->
        <section class="Statistics-card">

            <div class="card">
                <h3>Total Bookings</h3>
                <p id="totalBookings">0</p>
            </div>

            <div class="card">
                <h3>Confirmed</h3>
                <p id="confirmedBookings">0</p>
            </div>

            <div class="card">
                <h3>Pending</h3>
                <p id="pendingBookings">0</p>
            </div>

            <div class="card">
                <h3>Cancelled</h3>
                <p id="cancelledBookings">0</p>
            </div>

        </section>
        <br>

        <!-- Select Room -->
        <form>
            <div class="form-group">
                <label for="roomSelect">Select Room</label>

                <select id="roomSelect" required>
                    <option>Choose room</option>
                </select>
            </div>
            <br>

            <!-- Check-in Date -->
            <div class="form-group">
                <label for="checkIn">Check-in Date:</label>
                <br>
                <input type="date" id="checkIn" required>
            </div>
            <br>

            <!-- Check-out Date -->
            <div class="form-group">
                <label for="checkOut">Check-out Date:</label>
                <br>
                <input type="date" id="checkOut" required>
            </div>
            <br>

            <!-- Booking Status -->
            <div class="form-group">
                <label for="bookingStatus">Booking Status:</label>
                <select id="bookingStatus" required>
                    <option value="Confirmed">Confirmed</option>
                    <option value="Pending">Pending</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>
            <br>

            <!-- Total Cost -->
            <div class="form-group">
                <label for="totalCost">Total Booking Cost (KSh):</label>
                <br>
                <input type="text" id="totalCost" placeholder="Calculated automatically" readonly>
            </div>

            <br>
            <!-- Form Buttons -->
            <div class="booking-buttons">

                <button type="submit" class="save-btn" id="saveBookingBtn">
                    Save Booking
                </button>
            </div>
        </form>

        <!-- Booking Records -->
        <section class="booking-table">

            <div>

                <h2>All Bookings</h2>

                <input type="text" id="bookingSearch" placeholder="Search bookings...">

            </div>
<br>
            <div class="table-container">

                <table border="1">

                    <thead>
                        <tr>
                            <th>Booking ID</th>
                            <th>Customer</th>
                            <th>Room</th>
                            <th>Check-in</th>
                            <th>Check-out</th>
                            <th>Nights</th>
                            <th>Total Cost</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="bookingList">
                        <!-- JavaScript will display bookings here -->
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    </body>

</html>

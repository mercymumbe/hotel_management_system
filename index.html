<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Pearl Hotel | login</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />

</head>

<body>
    <!-- Main login container -->
    <div class="login-container">

        <!-- Left side: Hotel image and branding -->
        <div class="login-image">

            <div class="hotel-brand">
                <h1>BLUE PEARL HOTEL</h1>
                <p>HOTEL MANAGEMENT SYSTEM</p>
            </div>

            <div class="welcome-text">
                <h2>Welcome to Blue Pearl Hotel</h2>

            </div>

        </div>
        
        <!-- right side:login form -->
         <div class="login-form-container">

            <div class="login-form">

                <h2>Welcome Back!</h2>

                <p class="login-description">
                    Please login to access your dashboard.
                </p>

                <form id="loginForm">

                    <!-- Username -->
                    <div class="form-group">

                        <label for="username">Username</label>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter your username"
                            required
                        >

                    </div>

                    <!-- Password -->
                    <div class="form-group">

                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>

                    <!-- Remember me -->
                    <div class="form-options">

                        <label>
                            <input type="checkbox" id="rememberMe">
                            Remember me
                        </label>

                    </div>

                    <!-- Login button -->
                    <button type="submit" id="loginButton">
                        Login
                    </button>

                    <!-- Error message -->
                    <p id="errorMessage"></p>

                </form>

<!-- //////////// -->
        

    <footer>
        <!-- quick links -->
        <div>
            <h3>Get in touch</h3>
            <a href="https://fontawesome.comfacebook"><i class="fa-brands fa-square-facebook"></i></a>
            <a href="https://fontawesome.cominstagram"><i class="fa-brands fa-instagram"></i></a>
        </div>
        <!-- copy right -->
        <div>
            <p>&copy;Hotel management System 2026|All rights reserved</p>
        </div>

    </footer>

    <script src="login.js"></script>
</body>

</html>

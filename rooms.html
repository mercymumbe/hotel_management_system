<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Pearl Hotel</title>
    <!-- Link CSS file -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />


</head>
<body>
<!-- Main dashboard container -->
<div class="dashboard-container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <!-- Logo -->
        <div class="logo">
            <h2> Blue pearl Hotel</h2>

        </div>
        <!-- navigation links -->
        <nav>
            <ul>
                <li><a href="index.html" class="active"><i class="fa fa-home" aria-hidden="true"></i>Dashboard</a>
                    </li>
                    <li><a href="rooms.html"> <i class="fa-solid fa-bed"></i>Rooms</a></li>
                    <li><a href="customers.html"><i class="fa-solid fa-users"></i>Customers</a></li>
                    <li><a href="bookings.html"><i class="fa-solid fa-calendar-days"></i>Bookings</a></li>
                    <li><a href="payments.html"><i class="fa fa-credit-card" aria-hidden="true"></i>payments</a></li>
                    <li><a href="reports.html">Reports</a></li>
                    <li><a href="settings.html"><i class="fa fa-sliders" aria-hidden="true"></i>Settings</a></li>
            </ul>
        </nav>

    </aside>

    <!-- Main content -->
    <main class="main-content">

        <!-- Header Section-->
        <section>
            <header class="header">
                <div>
                    <h1>Rooms</h1>
                </div>
                <div class="admin-info">
                    <span>Administrator</span>
                </div>

            </header>
        </section>
        <!-- Room Statistics -->
        <section class="Statistics-card">

            <div class="static-card">
                <i class="fa-solid fa-bed"></i>
                <h3>Total Rooms</h3>
                <p id="totalRooms">20</p>
            </div>

            <div class="static-card">
                <i class="fa-solid fa-check-circle"></i>
                <h3>Available Rooms</h3>
                <p id="availableRooms">20</p>
            </div>

            <div class="static-card">
                <i class="fa-solid fa-calendar-days"></i>
                <h3>Booked Rooms</h3>
                <p id="bookedRooms">0</p>
            </div>

            <div class="static-card">
                 <i class="fa-solid fa-user"></i>
                <h3>Occupied Rooms</h3>
                <p id="occupiedRooms">0</p>
            </div>

        </section>
        
        <!-- Add Room Form -->
         <div class="container-grid">
        <section class="room-form">

            <h2>Add New Room</h2>

            <form id="roomForm">

                <div class="form-group">
                    <label for="roomNumber">Room Number:</label>
                    <br>
                    <input type="text" id="roomNumber" placeholder="Enter room number" required>
                </div>
                <br>
                <div class="form-group">
                    <label for="roomType">Room Type:</label>
                    <br>
                    <select id="roomType" required>
                        <option value="">Select room type</option>
                        <option value="Single">Single</option>
                        <option value="Double">Double</option>
                        <option value="Suite">Suite</option>
                    </select>
                </div>
                <br>
                <div class="form-group">
                    <label for="roomPrice">Price Per Night (KSh):</label>
                    <br>
                    <input type="number" id="roomPrice" placeholder="Enter room price" min="1" required>
                </div>
                <br>
                <div class="form-group">
                    <label for="roomStatus">Room Status:</label>
                    <br>
                    <select id="roomStatus" required>
                        <option value="">Select status</option>
                        <option value="available">Available</option>
                        <option value="booked">Booked</option>
                        <option value="occupied">Occupied</option>
                    </select>
                </div>
                <br>
                <button type="submit" class="save-btn">
                    Save Room
                </button>

            </form>

        </section>
        <!-- Room Records -->
        <section class="room-table">

            <div class="section-header">
                <h2>View All Rooms</h2>

                <input type="text" id="roomSearch" placeholder="Search room...">
            </div>
            <br>
            <div class="table-container">

                <table border="1">

                    <thead>
                        <tr>
                            <th>Room Number</th>
                            <th>Room Type</th>
                            <th>Price Per Night</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="roomList">
                    </tbody>
                </table>
            </div>
         </section>
         </div>
    </main>
</div>

<script src="rooms.js"></script>
    </body>

</html>
